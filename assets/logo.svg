<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" role="img" aria-label="Dulhan Mehndi Art logo">
  <defs>
    <style>
      .k{fill:none;stroke:#2A1A10;stroke-linecap:round}
      .f{fill:#2A1A10;stroke:none}
      text{fill:#2A1A10}
    </style>
  </defs>

  <!-- outer double oval frame -->
  <ellipse class="k" cx="300" cy="380" rx="282" ry="330" stroke-width="7"/>
  <ellipse class="k" cx="300" cy="380" rx="268" ry="316" stroke-width="2.5"/>

  <!-- dotted inner arch -->
  <path class="k" d="M78 340 A 240 250 0 0 1 522 340" stroke-width="4" stroke-dasharray="1 12"/>

  <!-- mandala crown: petal fans along the top arch -->
  <g class="k" stroke-width="3">
    <g transform="translate(300 92)">
      <path d="M0-58c10 14 10 30 0 44c-10-14-10-30 0-44Z"/>
      <path d="M0-40c6 9 6 19 0 27c-6-8-6-18 0-27Z"/>
      <path d="M-26-44c11 9 15 23 9 36c-12-7-16-22-9-36Z"/>
      <path d="M26-44c-11 9-15 23-9 36c12-7 16-22 9-36Z"/>
      <circle class="f" cx="0" cy="-66" r="4"/>
      <circle class="f" cx="-20" cy="-56" r="3"/>
      <circle class="f" cx="20" cy="-56" r="3"/>
    </g>
    <!-- fanned lotus petals left/right of crown -->
    <g transform="translate(178 140) rotate(-38)">
      <path d="M0-40c12 12 12 30 0 44c-12-14-12-32 0-44Z"/>
      <path d="M0-26c7 8 7 18 0 26c-7-8-7-18 0-26Z"/>
    </g>
    <g transform="translate(422 140) rotate(38)">
      <path d="M0-40c12 12 12 30 0 44c-12-14-12-32 0-44Z"/>
      <path d="M0-26c7 8 7 18 0 26c-7-8-7-18 0-26Z"/>
    </g>
    <g transform="translate(122 196) rotate(-58)">
      <path d="M0-38c11 11 11 28 0 41c-11-13-11-30 0-41Z"/>
      <path d="M0-24c6 7 6 16 0 23c-6-7-6-16 0-23Z"/>
    </g>
    <g transform="translate(478 196) rotate(58)">
      <path d="M0-38c11 11 11 28 0 41c-11-13-11-30 0-41Z"/>
      <path d="M0-24c6 7 6 16 0 23c-6-7-6-16 0-23Z"/>
    </g>
    <g transform="translate(238 108) rotate(-18)">
      <path d="M0-36c10 10 10 26 0 38c-10-12-10-28 0-38Z"/>
      <path d="M0-22c5 6 5 14 0 20c-5-6-5-14 0-20Z"/>
    </g>
    <g transform="translate(362 108) rotate(18)">
      <path d="M0-36c10 10 10 26 0 38c-10-12-10-28 0-38Z"/>
      <path d="M0-22c5 6 5 14 0 20c-5-6-5-14 0-20Z"/>
    </g>
  </g>
  <!-- crown top finial -->
  <g class="k" stroke-width="3.5" transform="translate(300 44)">
    <path d="M0-30c8 10 8 22 0 32c-8-10-8-22 0-32Z"/>
    <circle class="f" cx="0" cy="-38" r="3.5"/>
  </g>

  <!-- side fleur accents on frame -->
  <g class="f">
    <g transform="translate(18 380)"><path d="M0 0c8-10 20-12 30-6c-10 6-22 4-30 6Zm0 0c8 10 20 12 30 6c-10-6-22-4-30-6Z"/><circle cx="34" cy="0" r="3"/></g>
    <g transform="translate(582 380) scale(-1 1)"><path d="M0 0c8-10 20-12 30-6c-10 6-22 4-30 6Zm0 0c8 10 20 12 30 6c-10-6-22-4-30-6Z"/><circle cx="34" cy="0" r="3"/></g>
  </g>

  <!-- big D monogram -->
  <text x="310" y="452" font-family="Didot, 'Playfair Display', 'Times New Roman', serif" font-size="290" font-weight="500" text-anchor="middle">D</text>

  <!-- floral vine over the D -->
  <g class="k" stroke-width="4">
    <path d="M232 470 C 246 430 262 396 292 366 C 306 352 320 344 336 340"/>
    <path d="M292 366 c -18 -4 -30 -16 -32 -32 c 16 0 28 10 32 32 Z"/>
    <path d="M318 348 c -4 -18 2 -32 16 -40 c 4 16 -2 30 -16 40 Z"/>
    <path d="M258 414 c -16 2 -28 -4 -34 -18 c 14 -4 26 2 34 18 Z"/>
    <path d="M276 390 c 2 -16 12 -26 26 -28 c 0 14 -10 24 -26 28 Z"/>
    <path d="M246 444 c -14 8 -28 6 -38 -4 c 10 -10 24 -10 38 4 Z"/>
    <!-- curling tendrils -->
    <path d="M336 340 c 22 -6 40 2 46 18 c 6 16 -4 30 -18 30 c -12 0 -18 -10 -14 -20 c 4 -8 14 -8 16 0"/>
    <path d="M232 470 c -6 22 -20 34 -40 34"/>
  </g>
  <!-- flower at vine base -->
  <g transform="translate(226 496)">
    <g class="k" stroke-width="3.5">
      <path d="M0-26c9 8 11 18 6 27c-10-2-15-12-6-27Z"/>
      <path d="M24-10c-2 12-9 19-19 20c-2-10 5-18 19-20Z"/>
      <path d="M16 22c-11 4-21 1-26-8c8-6 18-3 26 8Z"/>
      <path d="M-16 22c-8-8-9-18-3-27c9 3 13 14 3 27Z"/>
      <path d="M-24-12c11-3 20 1 24 10c-8 6-18 2-24-10Z"/>
    </g>
    <circle class="k" r="7" stroke-width="3"/>
    <circle class="f" r="2.5"/>
  </g>
  <g class="f">
    <circle cx="382" cy="330" r="4"/><circle cx="398" cy="352" r="3"/><circle cx="368" cy="310" r="3"/>
  </g>

  <!-- script name -->
  <text x="300" y="596" font-family="'Great Vibes','Snell Roundhand','Brush Script MT',cursive" font-size="58" text-anchor="middle" textLength="420" lengthAdjust="spacingAndGlyphs">Dulhan Mehndi Art</text>
  <g class="k" stroke-width="2.5"><path d="M508 548 c 3 -6 9 -6 12 0 c 3 -6 9 -6 12 0 c 0 7 -12 14 -12 14 s -12 -7 -12 -14 Z" transform="scale(0.9) translate(56 4)"/></g>

  <!-- divider with floret -->
  <g class="k" stroke-width="3">
    <path d="M150 630 H 262 M338 630 H 450"/>
    <circle class="f" cx="272" cy="630" r="3"/><circle class="f" cx="328" cy="630" r="3"/>
    <g transform="translate(300 630)">
      <path d="M0-14c5 5 5 11 0 16c-5-5-5-11 0-16ZM0 14c5-5 5-11 0-16c-5 5-5 11 0 16ZM-14 0c5-5 11-5 16 0c-5 5-11 5-16 0ZM14 0c-5-5-11-5-16 0c5 5 11 5 16 0Z"/>
      <circle class="f" r="2.5"/>
    </g>
  </g>

  <!-- tagline -->
  <text x="300" y="676" font-family="'Cormorant Garamond','Times New Roman',serif" font-size="26" font-weight="600" letter-spacing="3" text-anchor="middle" textLength="380" lengthAdjust="spacingAndGlyphs">WHERE TRADITION MEETS ELEGANCE</text>

  <!-- bottom flourish -->
  <g class="k" stroke-width="3" transform="translate(300 714)">
    <path d="M0-8c6 6 6 14 0 20c-6-6-6-14 0-20Z"/>
    <path d="M-14 6c-10 4-20 2-26-6c8-6 18-4 26 6Z"/>
    <path d="M14 6c10 4 20 2 26-6c-8-6-18-4-26 6Z"/>
  </g>
</svg>
